name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.headers }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            headers: linux-headers-generic
          - os: ubuntu-24.04
            headers: linux-headers-generic
          - os: ubuntu-24.04
            headers: linux-headers-generic-hwe-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel headers and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.headers }} \
            build-essential \
            dkms \
            kmod

      - name: Resolve installed kernel version
        run: |
          KSRC=$(ls -d /usr/src/linux-headers-*-generic 2>/dev/null | sort -V | tail -1)
          test -n "$KSRC"
          KVER=${KSRC#/usr/src/linux-headers-}
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KSRC=$KSRC" >> "$GITHUB_ENV"
          echo "Testing against $KVER"

      - name: Build with default config (CONFIG_BR_EXT=y)
        run: make -j"$(nproc)" KSRC="$KSRC"

      - name: Build with CONFIG_BR_EXT=n
        run: |
          make clean
          make -j"$(nproc)" CONFIG_BR_EXT=n KSRC="$KSRC"

      - name: Verify module metadata
        run: |
          modinfo 8821ce.ko
          modinfo 8821ce.ko | grep -q '^depends:'

      - name: Upload kernel module artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8821ce-${{ matrix.os }}-${{ matrix.headers }}
          path: 8821ce.ko
          retention-days: 7
          if-no-files-found: error

  clang-compat:
    name: Clang Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang and kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            linux-headers-generic \
            build-essential \
            clang \
            lld \
            kmod

      - name: Resolve installed kernel version
        run: |
          KSRC=$(ls -d /usr/src/linux-headers-*-generic 2>/dev/null | sort -V | tail -1)
          test -n "$KSRC"
          KVER=${KSRC#/usr/src/linux-headers-}
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KSRC=$KSRC" >> "$GITHUB_ENV"

      - name: Build with Clang (LLVM=1)
        run: make -j"$(nproc)" LLVM=1 KSRC="$KSRC"

      - name: Verify Clang-built module
        run: |
          modinfo 8821ce.ko
          file 8821ce.ko

  dkms-test:
    name: DKMS Integration Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install DKMS and kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            linux-headers-generic \
            dkms \
            build-essential \
            kmod

      - name: Resolve installed kernel version
        run: |
          KSRC=$(ls -d /usr/src/linux-headers-*-generic 2>/dev/null | sort -V | tail -1)
          test -n "$KSRC"
          KVER=${KSRC#/usr/src/linux-headers-}
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KSRC=$KSRC" >> "$GITHUB_ENV"

      - name: Add module to DKMS
        run: |
          MODULE_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "test")
          echo "MODULE_VERSION=$MODULE_VERSION" >> "$GITHUB_ENV"
          sudo dkms add -m rtl8821ce -v "$MODULE_VERSION" .

      - name: Build module via DKMS
        run: sudo dkms build -m rtl8821ce -v "$MODULE_VERSION" -k "$KVER"

      - name: Verify DKMS build output
        run: |
          ls -la "/var/lib/dkms/rtl8821ce/$MODULE_VERSION/$KVER/$(dpkg --print-architecture)/module/"

  latest-kernel:
    name: Latest kernel (Arch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    steps:
      - name: Install git for actions/checkout
        run: pacman -Syu --noconfirm git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel headers and build dependencies
        run: pacman -S --noconfirm --needed base-devel linux-headers kmod

      - name: Build against the current Arch kernel
        run: |
          KVER=$(ls /usr/lib/modules | sort -V | tail -1)
          test -n "$KVER"
          echo "Testing against $KVER"
          make -j"$(nproc)" KVER="$KVER"

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files for trailing whitespace
        run: |
          if git grep -n '[[:space:]]$' -- '*.sh' Makefile dkms.conf README.md .gitignore; then
            echo "::error::Trailing whitespace found"
            exit 1
          fi

      - name: Check shell syntax
        run: |
          for script in dkms-install.sh dkms-remove.sh get_sources.sh clean; do
            bash -n "$script"
          done

      - name: Verify Makefile syntax
        run: |
          # Parse the Makefile without running recipes. Exit 1 means the
          # default goal is out of date (normal); exit 2 is a parse error.
          rc=0
          make -qp >/dev/null 2>&1 || rc=$?
          test "$rc" -le 1

      - name: Check dkms.conf format
        run: |
          for field in PACKAGE_NAME PACKAGE_VERSION BUILT_MODULE_NAME MAKE CLEAN DEST_MODULE_LOCATION AUTOINSTALL; do
            if ! grep -q "^$field" dkms.conf; then
              echo "::error::Missing required field: $field"
              exit 1
            fi
          done
          echo "dkms.conf validation passed"

  summary:
    name: Build Summary
    needs: [build, clang-compat, dkms-test, latest-kernel, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Build matrix: ${{ needs.build.result }}"
          echo "Clang compat: ${{ needs.clang-compat.result }}"
          echo "DKMS test: ${{ needs.dkms-test.result }}"
          echo "Latest kernel: ${{ needs.latest-kernel.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          if [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.clang-compat.result }}" != "success" ]] || \
             [[ "${{ needs.dkms-test.result }}" != "success" ]] || \
             [[ "${{ needs.latest-kernel.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          echo "All checks passed!"
