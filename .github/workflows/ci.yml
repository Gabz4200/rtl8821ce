name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: install dependencies
      run: sudo apt install bc module-assistant build-essential
    - name: prepare build
      run: sudo m-a prepare
    - name: build (default config, CONFIG_BR_EXT=y)
      run: make
    - name: build (CONFIG_BR_EXT=n fallback path)
      run: make clean && make CONFIG_BR_EXT=n
